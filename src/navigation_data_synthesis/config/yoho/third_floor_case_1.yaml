isaacsim.replicator.agent:
  version: 1.7.0
  seed: 42
  simulation_duration: 60.0

  environment:
    base_stage_asset_path: "/project/EXP/Sence/Sences/Third_Floor.usd"
    prop_asset_paths:
      # 缩小身体碰撞体并关闭实时障碍物避让；开关位于此 USD 设置层。
      - "character_body_colliders.usda"

  character:
    root_prim_path: "/World/Characters"
    motion_library_path: "/project/isaacsim/isaacsim_assets/Assets/Isaac/6.1/Isaac/People/MotionLibrary/HumanMotionLibrary.usd"

    groups:
      walker_01:
        num: 1
        asset_path: "Isaac/People/Characters/"
        spawn_positions:
          - [2.06241, 1.09919, 0.0]
        spawn_orientations:
          - 180.0

        # 默认行为：持续原地待机。
        routines:
          - stop:
              time_range: [5.0, 5.0]

      walker_02:
        num: 1
        asset_path: "Isaac/People/Characters/"
        spawn_positions:
          - [1.93617, 0.27982, 0.0]
        spawn_orientations:
          - -90.0

        # 新增：触发序列结束后，返回停止行为，而不是默认游走。
        routines:
          - stop:
              time_range: [5.0, 5.0]

        triggers:
          - time_trigger:
              # IRA 1.7.9 按帧号精确触发；第 0 帧早于角色初始化，延后到 1 秒。
              time: 1.0
              priority: 10
              behavior:
                - patrol:
                    speed_range: [0.5, 1.0]
                    repeat: 1
                    path_points:
                      - [-1.50795, 0.94228, 0.0]
                - stop:
                    time_range: [5.0, 5.0]
      walker_03:
        num: 1
        asset_path: "Isaac/People/Characters/"
        spawn_positions:
          - [2.98087, -0.45281, 0.0]
        spawn_orientations:
          - -180.0

        # 新增：触发序列结束后，返回停止行为，而不是默认游走。
        routines:
          - stop:
              time_range: [5.0, 5.0]

        triggers:
          - time_trigger:
              # IRA 1.7.9 按帧号精确触发；第 0 帧早于角色初始化，延后到 1 秒。
              time: 1.0
              priority: 10
              behavior:
                - patrol:
                    speed_range: [0.5, 1.0]
                    repeat: 1
                    path_points:
                      - [-2.98846, -0.94616, 0.0]
                - stop:
                    time_range: [5.0, 5.0]
